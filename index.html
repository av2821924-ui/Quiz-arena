<style>
  ::-webkit-scrollbar{width:6px;height:6px}
  ::-webkit-scrollbar-track{background:#0a0d1a}
  ::-webkit-scrollbar-thumb{background:#252e56;border-radius:999px}
  .glassmorphism{background:rgba(18,23,45,.85);backdrop-filter:blur(12px)}
  .option-btn{transition:all .15s ease}
  .option-btn:hover:not(:disabled){transform:translateY(-2px)}
  .option-btn:active:not(:disabled){transform:scale(.99)}
  .shake{animation:shakeAnim .4s ease-in-out}
  @keyframes shakeAnim{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
  .pop-in{animation:popIn .35s cubic-bezier(.2,.8,.3,1.2)}
  @keyframes popIn{0%{opacity:0;transform:translateY(14px) scale(.97)}100%{opacity:1;transform:translateY(0) scale(1)}}
  .fade-up{animation:fadeUp .45s ease}
  @keyframes fadeUp{0%{opacity:0;transform:translateY(18px)}100%{opacity:1;transform:translateY(0)}}
  .qr-frame{background:#fff;padding:12px;border-radius:18px;line-height:0;box-shadow:0 0 0 1px rgba(255,255,255,.15),0 20px 45px -20px rgba(217,70,239,.9)}
  .qr-frame img,.qr-frame canvas{display:block;border-radius:8px;margin:auto}
  .scan-line{position:absolute;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,#d946ef,transparent);animation:scanMove 2.4s ease-in-out infinite}
  @keyframes scanMove{0%{top:6%;opacity:0}15%{opacity:1}85%{opacity:1}100%{top:92%;opacity:0}}
  .code-box{letter-spacing:.35em;font-family:'Space Grotesk',monospace}
  .ring-pulse{animation:ringPulse 1.8s ease-out infinite}
  @keyframes ringPulse{0%{box-shadow:0 0 0 0 rgba(16,185,129,.5)}70%{box-shadow:0 0 0 12px rgba(16,185,129,0)}100%{box-shadow:0 0 0 0 rgba(16,185,129,0)}}
  .timer-bar{transition:width 1s linear}
  .opt-correct{background:linear-gradient(135deg,#059669,#10b981)!important;border-color:#10b981!important;color:#fff!important;box-shadow:0 0 25px -5px rgba(16,185,129,.6)}
  .opt-wrong{background:linear-gradient(135deg,#be123c,#f43f5e)!important;border-color:#f43f5e!important;color:#fff!important}
  .opt-dim{opacity:.35;filter:grayscale(1)}
  .neon-glow{box-shadow:0 0 40px -18px rgba(217,70,239,.9)}
  #qr-reader video{border-radius:12px!important}
  .confetti-canvas{position:fixed;inset:0;pointer-events:none;z-index:70}
  .float-slow{animation:floaty 5s ease-in-out infinite}
  @keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
  .glow-text{text-shadow:0 0 24px rgba(129,140,248,.55)}
</style>

   ============================================================ */
const SafeStore = {
  mem: {},
  get(k){
    try{
      const v = localStorage.getItem(k);
      return v === null ? (this.mem[k] !== undefined ? this.mem[k] : null) : v;
    }catch(e){ return this.mem[k] !== undefined ? this.mem[k] : null; }
  },
  set(k, v){
    try{ localStorage.setItem(k, v); }catch(e){}
    this.mem[k] = v;
  },
  remove(k){
    try{ localStorage.removeItem(k); }catch(e){}
    delete this.mem[k];
  }
};

/* ============================================================
   SOUND (Web Audio API)
   ============================================================ */
class SoundManager {
  constructor(){ this.ctx = null; this.enabled = true; }
  init(){
    if(!this.ctx){
      const A = window.AudioContext || window.webkitAudioContext;
      if(A) this.ctx = new A();
    }
    if(this.ctx && this.ctx.state === 'suspended'){ this.ctx.resume().catch(function(){}); }
  }
  toggleSound(){
    this.enabled = !this.enabled;
    const i = document.getElementById('sound-icon');
    if(!i) return;
    if(this.enabled){ i.className = 'fa-solid fa-volume-high text-sm'; this.playClick(); }
    else { i.className = 'fa-solid fa-volume-xmark text-sm text-slate-500'; }
  }
  tone(freq, type, dur, gain){
    if(!this.enabled) return;
    this.init();
    if(!this.ctx) return;
    type = type || 'sine'; dur = dur || .15; gain = gain === undefined ? .12 : gain;
    try{
      const o = this.ctx.createOscillator();
      const g = this.ctx.createGain();
      o.type = type;
      o.frequency.setValueAtTime(freq, this.ctx.currentTime);
      g.gain.setValueAtTime(gain, this.ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(.001, this.ctx.currentTime + dur);
      o.connect(g); g.connect(this.ctx.destination);
      o.start(); o.stop(this.ctx.currentTime + dur);
    }catch(e){}
  }
  playClick(){ this.tone(600,'sine',.05,.08); }
  playCorrect(){
    const self = this;
    [523,659,784,1046].forEach(function(f,i){ setTimeout(function(){ self.tone(f,'triangle',.25,.12); }, i*70); });
  }
  playWrong(){
    const self = this;
    [220,196,174].forEach(function(f,i){ setTimeout(function(){ self.tone(f,'sawtooth',.2,.09); }, i*90); });
  }
  playTick(){ this.tone(900,'square',.03,.025); }
  playJoin(){
    const self = this;
    [660,880,1100].forEach(function(f,i){ setTimeout(function(){ self.tone(f,'sine',.16,.12); }, i*80); });
  }
  playFanfare(){
    const self = this;
    [440,554,659,880,1100].forEach(function(n,i){ setTimeout(function(){ self.tone(n,'triangle',.3,.18); }, i*120); });
  }
}

/* ============================================================
   HELPERS
   ============================================================ */
function shuffle(a){
  const x = a.slice();
  for(let i=x.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    const t = x[i]; x[i] = x[j]; x[j] = t;
  }
  return x;
}
function getQuestions(cat, n){
  n = n || 10;
  let pool = [];
  if(cat === 'mixed'){
    Object.keys(QUESTION_BANK).forEach(function(k){ pool = pool.concat(QUESTION_BANK[k]); });
  }else{
    pool = (QUESTION_BANK[cat] || []).slice();
    if(pool.length < n){
      let extra = [];
      Object.keys(QUESTION_BANK).forEach(function(k){ extra = extra.concat(QUESTION_BANK[k]); });
      extra = shuffle(extra.filter(function(q){ return pool.indexOf(q) === -1; }));
      pool = pool.concat(extra.slice(0, n - pool.length));
    }
  }
  return shuffle(pool).slice(0, n);
}
function esc(s){
  return String(s === undefined || s === null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

  createRoom(){
    soundManager.playJoin();
    let code = RoomManager.genCode();
    let guard = 0;
    while(RoomManager.get(code) && guard++ < 40) code = RoomManager.genCode();
    const room = {
      code: code,
      joinUrl: this.buildJoinUrl(code),
      category: 'technical',
      status: 'lobby',
      hostId: this.clientId,
      createdAt: Date.now(),
      questions: [],
      players: [{
        id: this.clientId, name: this.playerName, avatar: this.playerAvatar,
        score:0, correct:0, maxStreak:0, progress:0, finished:false,
        isHost:true, isBot:false, joinedVia:'host'
      }]
    };
    RoomManager.save(room);
    this.room = room;
    this.roomCode = code;
    this.showLobby();
    this.toast('Room ' + code + ' created — show the QR!','success');
  },

  joinRoomByCode(raw){
    soundManager.playClick();
    const code = this.parseCodeInput(raw);
    if(!code){ this.toast('Enter a valid 6-character code','error'); return; }
    const r = RoomManager.get(code);
    if(!r){ this.toast('Room ' + code + ' not found. Check the code.','error'); return; }
    if(r.status === 'finished'){ this.toast('Room already finished','error'); return; }
    const already = r.players.some(function(p){ return p.id === app.clientId; });
    if(r.players.length >= 8 && !already){ this.toast('Room is full (8 max)','error'); return; }

    let me = r.players.filter(function(p){ return p.id === app.clientId; })[0];
    if(!me){
      r.players.push({
        id:this.clientId, name:this.playerName, avatar:this.playerAvatar,
        score:0, correct:0, maxStreak:0, progress:0, finished:false,
        isHost:false, isBot:false, joinedVia:'qr'
      });
      soundManager.playJoin();
    }else{
      me.name = this.playerName; me.avatar = this.playerAvatar;
    }
    RoomManager.save(r);
    this.room = r;
    this.roomCode = r.code;
    if(r.status === 'playing') this.enterRoomQuiz(r);
    else this.showLobby();
  },

  leaveRoom(){
    soundManager.playClick();
    if(!this.room){ this.showHome(); return; }
    const r = RoomManager.get(this.room.code);
    if(r){
      if(r.hostId === this.clientId){
        RoomManager.remove(r.code);
        this.toast('Room closed','success');
      }else{
        r.players = r.players.filter(function(p){ return p.id !== app.clientId; });
        RoomManager.save(r);
        this.toast('Left room','success');
      }
    }
    this.room = null;
    this.roomCode = null;
    clearInterval(this.botSimInt);
    if(this.quiz) clearInterval(this.quiz.timerInterval);
    this.showHome();
  },

  kickPlayer(pid){
    const r = RoomManager.get(this.room.code);

    r.players = r.players.filter(function(p){ return p.id !== pid; });
    RoomManager.save(r);
    this.room = r;
    this.showLobby();

    if(r.players.length >= 8){ this.toast('Room full','error'); return; }
    const avail = BOT_DEFS.filter(function(b){

    const b = avail.length ? avail[Math.floor(Math.random()*avail.length)]
      : {name:'Guest' + Math.floor(Math.random()*900 + 100), avatar: AVATARS[Math.floor(Math.random()*AVATARS.length)], skill:.7};
    r.players.push({
      id:'bot_' + Math.random().toString(36).slice(2,9),
      name:b.name, avatar:b.avatar, skill:b.skill || .75,
      score:0, correct:0, maxStreak:0, progress:0, finished:false,
      isHost:false, isBot:true, joinedVia:'qr'
    });
    RoomManager.save(r);
    this.room = r;
    soundManager.playJoin();
    this.showLobby();
    this.toast(b.name + ' scanned & joined!','success');

  openScanner(){
    soundManager.playClick();
    const m = document.getElementById('scanner-modal');
    m.classList.remove('hidden'); m.classList.add('flex');
    const status = document.getElementById('scan-status');
    status.innerText = 'Starting camera...';

    const self = this;
    const onOk = function(txt){
      soundManager.playJoin();
      status.innerText = 'QR found: ' + txt;
      self.closeScanner(true);
      const code = self.parseCodeInput(txt);
      if(code) self.joinRoomByCode(code);
      else self.toast('Invalid QR content','error');
    };

    try{
      if(typeof Html5Qrcode === 'undefined'){
        status.innerText = 'Scanner library failed to load — paste the link below.';
        return;
      }
      this.html5Qr = new Html5Qrcode('qr-reader');
      this.html5Qr.start(
        {facingMode:'environment'},
        {fps:10, qrbox:{width:240, height:240}},
        onOk,
        function(){}
      ).then(function(){
        status.innerText = 'Point camera at the host QR code';
      }).catch(function(){
        status.innerText = 'Camera blocked — allow permission or paste the link below.';
      });
    }catch(e){
      status.innerText = 'Camera unavailable — paste the link below.';
    }
  },

  closeScanner(silent){
    const m = document.getElementById('scanner-modal');
    m.classList.add('hidden'); m.classList.remove('flex');
    try{
      if(this.html5Qr){
        const h = this.html5Qr;
        this.html5Qr = null;
        h.stop().then(function(){
          try{ h.clear(); }catch(e){}
          document.getElementById('qr-reader').innerHTML = '';
        }).catch(function(){
          document.getElementById('qr-reader').innerHTML = '';
        });
      }
    }catch(e){}
    if(!silent) soundManager.playClick();
  },

  manualScanParse(){
    const v = document.getElementById('manual-scan-input').value;
    const code = this.parseCodeInput(v);
    if(!code){ this.toast('Invalid code/link','error'); return; }
    this.closeScanner(true);
    this.joinRoomByCode(code);
  },

  /* ============================================================
     SYNC
     ============================================================ */
  syncRoom(){
    if(!this.roomCode) return;
    const r = RoomManager.get(this.roomCode);
    if(!r){
      if(this.room){
        this.toast('Room closed by host','error');
        this.room = null; this.roomCode = null;
        clearInterval(this.botSimInt);
        if(this.quiz) clearInterval(this.quiz.timerInterval);
        if(this.view !== 'home') this.showHome(); else this.updateNav();
      }
      return;
    }
    const prev = this.room;
    this.room = r;
    this.updateNav();

    if(r.status === 'lobby' && this.view === 'lobby'){
      const g = document.getElementById('participants-grid');
      if(g){
        const self = this;
        g.innerHTML = r.players.map(function(p){ return self.playerCardHTML(p); }).join('') +
          (r.players.length < 8 ? '<div class="border border-dashed border-arena-border rounded-xl p-3 flex items-center gap-2.5 opacity-60"><div class="w-9 h-9 rounded-lg bg-arena-dark flex items-center justify-center text-slate-500"><i class="fa-solid fa-qrcode"></i></div><p class="text-[11px] text-slate-500">Waiting for scanners…</p></div>' : '');
      }
      if(prev && r.players.length > prev.players.length) soundManager.playJoin();
    }else if(r.status === 'playing' && this.view === 'lobby'){
      this.enterRoomQuiz(r);
    }else if(r.status === 'playing' && (this.view === 'quiz' || this.view === 'results') && this.quiz && this.quiz.mode === 'room'){
      this.updateRoomLeaderboard();
    }else if(r.status === 'finished' && this.view !== 'results'){
      if(this.quiz) clearInterval(this.quiz.timerInterval);
      clearInterval(this.botSimInt);
      this.showRoomResults();
    }
  },

  /* ============================================================
     GAME ENGINE — SOLO / BOTS
     ============================================================ */
  startGame(cat){
    if(this.quiz) clearInterval(this.quiz.timerInterval);
    clearTimeout(this._nx);
    const qs = getQuestions(cat, 10);
    let opps = [];
    if(this.gameMode === 'multiplayer'){
      opps = shuffle(BOT_DEFS).slice(0,3).map(function(b){
        return {name:b.name, avatar:b.avatar, skill:b.skill, score:0, correct:0, answered:false, lastCorrect:false};
      });
    }
    this.quiz = {
      mode: this.gameMode === 'multiplayer' ? 'bots' : 'solo',
      category: cat,
      questions: qs,
      index: 0, score: 0, correct: 0, streak: 0, maxStreak: 0,
      timeLeft: 15, timerInterval: null, locked: false,
      lifelines: {fifty:true, freeze:true, double:true},
      isDouble: false, opponents: opps, log: [], frozen: false
    };
    this.renderQuiz();
  },

  enterRoomQuiz(r){
    if(this.quiz) clearInterval(this.quiz.timerInterval);
    clearTimeout(this._nx);
    this.view = 'quiz';
    this.quiz = {
      mode:'room',
      category: r.category,
      questions: (r.questions && r.questions.length) ? r.questions : getQuestions(r.category, 10),
      index:0, score:0, correct:0, streak:0, maxStreak:0,
      timeLeft:15, timerInterval:null, locked:false,
      lifelines:{fifty:true, freeze:true, double:true},
      isDouble:false, opponents:[], log:[], frozen:false
    };
    this.renderQuiz();
    if(r.hostId === this.clientId) this.startBotSim();
  },

  startBotSim(){
    clearInterval(this.botSimInt);
    const self = this;
    this.botSimInt = setInterval(function(){
      const r = RoomManager.get(self.roomCode);
      if(!r || r.status !== 'playing'){ clearInterval(self.botSimInt); return; }
      let changed = false;
      const total = (r.questions && r.questions.length) || 10;
      r.players.forEach(function(p){
        if(p.isBot && !p.finished){
          if(Math.random() < 0.72){
            p.progress = Math.min(total, (p.progress || 0) + 1);
            changed = true;
            const skill = p.skill || .75;
            if(Math.random() < skill){
              const pts = 100 + Math.floor(Math.random()*120) + (p.progress * 5);
              p.score = (p.score || 0) + pts;
              p.correct = (p.correct || 0) + 1;
            }
            if(p.progress >= total) p.finished = true;
          }
        }
      });
      if(changed){
        const allDone = r.players.every(function(p){ return p.finished; });
        if(allDone) r.status = 'finished';
        RoomManager.save(r);
        self.room = r;
        if(self.view === 'quiz' || self.view === 'results') self.updateRoomLeaderboard();
        if(r.status === 'finished'){
          clearInterval(self.botSimInt);
          if(self.quiz) clearInterval(self.quiz.timerInterval);
          if(self.view !== 'results') self.showRoomResults();
        }
      }
    }, 3200);
  },

  renderQuiz(){
    this.view = 'quiz';
    this._resultShown = false;
    soundManager.playClick();
    const q = this.quiz;
    const cat = CATEGORIES.filter(function(c){ return c.id === q.category; })[0] || CATEGORIES[0];
    const isRoom = q.mode === 'room';
    const c = document.getElementById('app-container');

    c.innerHTML = `
      <div class="max-w-6xl mx-auto w-full space-y-4 fade-up">
        <div class="flex flex-wrap items-center justify-between gap-2">
          <button onclick="${isRoom ? 'app.showLobbyConfirm()' : 'app.showHome()'}" class="text-xs font-bold text-slate-400 hover:text-white">
            <i class="fa-solid fa-arrow-left mr-1"></i> ${isRoom ? 'Lobby' : 'Quit'}
          </button>
          <div class="flex items-center gap-2 text-xs font-bold">
            <span class="px-3 py-1.5 rounded-full bg-indigo-600/20 border border-indigo-500/40 text-indigo-300"><i class="fa-solid ${cat.icon} mr-1"></i>${cat.name}</span>
            ${isRoom ? '<span class="px-3 py-1.5 rounded-full bg-fuchsia-600/20 border border-fuchsia-500/40 text-fuchsia-300">ROOM ' + this.room.code + '</span>' : ''}
            <span class="px-3 py-1.5 rounded-full bg-arena-card border border-arena-border">Q <span id="q-num">1</span>/${q.questions.length}</span>
          </div>
          <div class="flex items-center gap-2 text-xs font-bold">
            <span id="hud-streak" class="px-3 py-1.5 rounded-full bg-orange-500/15 border border-orange-500/30 text-orange-300">🔥 x0</span>
            <span id="hud-score" class="px-3 py-1.5 rounded-full bg-emerald-500/15 border border-emerald-500/30 text-emerald-300">0 pts</span>
          </div>
        </div>

        <div class="grid lg:grid-cols-[1fr_300px] gap-4 items-start">
          <div class="space-y-4">
            <div class="bg-arena-card border border-arena-border rounded-2xl p-4">
              <div class="flex justify-between text-xs font-bold mb-2">
                <span class="text-slate-400">⏱ Time Left</span>
                <span id="timer-text" class="text-white">15s</span>
              </div>
              <div class="h-3 rounded-full bg-arena-dark overflow-hidden">
                <div id="timer-bar" class="timer-bar h-full rounded-full bg-gradient-to-r from-emerald-500 to-teal-400" style="width:100%"></div>
              </div>
              <div class="flex gap-2 mt-3">
                <button id="ll-fifty" onclick="app.useLifeline('fifty')" class="flex-1 py-2 rounded-xl text-[11px] font-bold bg-arena-dark border border-arena-border hover:border-indigo-500">🌓 50:50</button>
                <button id="ll-freeze" onclick="app.useLifeline('freeze')" class="flex-1 py-2 rounded-xl text-[11px] font-bold bg-arena-dark border border-arena-border hover:border-indigo-500">❄️ Freeze</button>
                <button id="ll-double" onclick="app.useLifeline('double')" class="flex-1 py-2 rounded-xl text-[11px] font-bold bg-arena-dark border border-arena-border hover:border-indigo-500">✨ 2x Points</button>
              </div>
            </div>

            <div id="q-card" class="bg-arena-card border border-arena-border rounded-3xl p-5 sm:p-7 pop-in"></div>
            <div id="explain-box" class="hidden bg-arena-card border border-indigo-500/30 rounded-2xl p-4"></div>
          </div>

          <div class="bg-arena-card border border-arena-border rounded-2xl p-4 lg:sticky lg:top-4">
            <p class="text-sm font-bold mb-3"><i class="fa-solid fa-ranking-star text-arena-gold mr-1"></i> Live Leaderboard</p>
            <div id="live-leaderboard" class="space-y-2"></div>
            <p class="text-[11px] text-slate-500 mt-3 text-center">${isRoom ? 'Syncs live from all scanners' : 'Bots answer in real-time'}</p>
          </div>
        </div>
      </div>`;

    this.showQuestion();
  },

  showLobbyConfirm(){
    if(this.quiz) clearInterval(this.quiz.timerInterval);
    clearTimeout(this._nx);
    this.showLobby();
  },

  showQuestion(){
    const q = this.quiz;
    if(!q) return;
    const Q = q.questions[q.index];
    if(!Q) return;
    q.locked = false;
    q.timeLeft = 15;
    q.frozen = false;

    const qn = document.getElementById('q-num');
    if(qn) qn.innerText = (q.index + 1);
    const hs = document.getElementById('hud-score');
    if(hs) hs.innerText = q.score + ' pts';
    const hk = document.getElementById('hud-streak');
    if(hk) hk.innerText = '🔥 x' + q.streak;

    const eb = document.getElementById('explain-box');
    if(eb){ eb.classList.add('hidden'); eb.innerHTML = ''; }

    const card = document.getElementById('q-card');
    if(card) card.classList.remove('shake');

    if(card){
      card.innerHTML = `
        <span class="text-[11px] font-black uppercase tracking-widest text-indigo-400">${esc(Q.sub || Q.category)}</span>
        <h2 class="text-lg sm:text-2xl font-bold mt-2 leading-snug">${esc(Q.question)}</h2>
        <div class="grid gap-3 mt-5">
          ${Q.options.map(function(o,i){
            const L = ['A','B','C','D'][i];
            return `<button id="opt-${i}" onclick="app.selectAnswer(${i})" class="option-btn text-left bg-arena-dark border-2 border-arena-border hover:border-indigo-500 rounded-2xl p-4 flex items-center gap-3">
              <span class="w-9 h-9 rounded-xl bg-indigo-600/20 border border-indigo-500/40 text-indigo-300 font-black text-sm flex items-center justify-center shrink-0">${L}</span>
              <span class="text-sm sm:text-base font-semibold">${esc(o)}</span>
            </button>`;
          }).join('')}
        </div>
        <p class="text-[11px] text-slate-500 mt-4 text-center">
          Streak bonus: +20 × streak • Speed bonus: +10 × seconds left ${q.isDouble ? '• <b class="text-fuchsia-300">2X ACTIVE</b>' : ''}
        </p>`;
    }

    this.updateLifelineUI();
    this.updateLeaderboard();
    this.startTimer();
    if(q.mode === 'bots') this.simulateBots();
  },

  startTimer(){
    const q = this.quiz;
    if(!q) return;
    clearInterval(q.timerInterval);
    const bar = document.getElementById('timer-bar');
    const txt = document.getElementById('timer-text');
    if(bar){
      bar.style.width = '100%';
      bar.className = 'timer-bar h-full rounded-full bg-gradient-to-r from-emerald-500 to-teal-400';
    }
    if(txt) txt.innerText = '15s';

    const self = this;
    const tick = function(){
      if(self.quiz !== q) return;
      if(q.frozen || q.locked) return;
      q.timeLeft--;
      const pct = Math.max(0, (q.timeLeft / 15) * 100);
      if(bar) bar.style.width = pct + '%';
      if(txt) txt.innerText = Math.max(0, q.timeLeft) + 's';
      if(bar){
        if(q.timeLeft <= 5){
          bar.className = 'timer-bar h-full rounded-full bg-gradient-to-r from-rose-600 to-red-400 animate-pulse';
          soundManager.playTick();
        }else if(q.timeLeft <= 10){
          bar.className = 'timer-bar h-full rounded-full bg-gradient-to-r from-amber-500 to-orange-400';
        }
      }
      if(q.timeLeft <= 0){
        clearInterval(q.timerInterval);
        self.selectAnswer(-1, true);
      }
    };
    q.timerInterval = setInterval(tick, 1000);
  },

  simulateBots(){
    const q = this.quiz;
    const self = this;
    q.opponents.forEach(function(b){
      b.answered = false;
      b.lastCorrect = false;
      const delay = 2500 + Math.random() * 9000;
      setTimeout(function(){
        if(self.quiz !== q) return;
        if(b.answered) return;
        const correct = Math.random() < b.skill;
        const tLeft = Math.max(1, q.timeLeft - Math.floor(Math.random() * 4));
        if(correct){
          b.score += 100 + tLeft * 8 + Math.floor(Math.random() * 40);
          b.correct++;
        }
        b.answered = true;
        b.lastCorrect = correct;
        if(self.view === 'quiz') self.updateLeaderboard();
      }, delay);
    });
  },

  updateLeaderboard(){
    if(!this.quiz) return;
    if(this.quiz.mode === 'room'){ this.updateRoomLeaderboard(); return; }
    const q = this.quiz;
    const rows = [{name:this.playerName, avatar:this.playerAvatar, score:q.score, me:true, ans:true, ok:true}]
      .concat(q.opponents.map(function(b){
        return {name:b.name, avatar:b.avatar, score:b.score, me:false, ans:b.answered, ok:b.lastCorrect};
      }));
    rows.sort(function(a,b){ return b.score - a.score; });
    const el = document.getElementById('live-leaderboard');
    if(!el) return;
    const self = this;
    el.innerHTML = rows.map(function(r,i){
      return `<div class="flex items-center gap-2.5 p-2.5 rounded-xl ${r.me ? 'bg-indigo-600/15 border border-indigo-500/40' : 'bg-arena-dark border border-arena-border'}">
        <span class="text-sm font-black w-6 text-center ${i === 0 ? 'text-arena-gold' : i === 1 ? 'text-slate-300' : i === 2 ? 'text-amber-600' : 'text-slate-500'}">${i+1}</span>
        <span class="text-xl">${r.avatar}</span>
        <div class="flex-1 min-w-0">
          <p class="text-xs font-bold truncate">${esc(r.name)} ${r.me ? '(You)' : ''}</p>
          <p class="text-[10px] text-slate-500">${r.me ? ('🔥 ' + q.score + ' pts') : (r.ans ? (r.ok ? '✅ answered' : '❌ answered') : '⌛ thinking…')}</p>
        </div>
        <span class="text-xs font-black text-emerald-300">${r.score}</span>
      </div>`;
    }).join('');
  },

  updateRoomLeaderboard(){
    const el = document.getElementById('live-leaderboard');
    if(!el) return;
    const r = RoomManager.get(this.roomCode) || this.room;
    if(!r) return;
    this.room = r;
    const total = (r.questions && r.questions.length) || 10;
    const sorted = r.players.slice().sort(function(a,b){ return (b.score||0) - (a.score||0); });
    el.innerHTML = sorted.map(function(p,i){
      const me = p.id === app.clientId;
      return `<div class="flex items-center gap-2.5 p-2.5 rounded-xl ${me ? 'bg-indigo-600/15 border border-indigo-500/40' : 'bg-arena-dark border border-arena-border'}">
        <span class="text-sm font-black w-6 text-center ${i === 0 ? 'text-arena-gold' : 'text-slate-500'}">${i+1}</span>
        <span class="text-xl">${p.avatar || '🙂'}</span>
        <div class="flex-1 min-w-0">
          <p class="text-xs font-bold truncate">${esc(p.name)} ${me ? '(You)' : ''} ${p.isBot ? '🤖' : ''}</p>
          <p class="text-[10px] text-slate-500">Q ${Math.min((p.progress || 0) + 1, total)}/${total} ${p.finished ? '• ✅ done' : ''}</p>
        </div>
        <span class="text-xs font-black text-emerald-300">${p.score || 0}</span>
      </div>`;
    }).join('');
  },

  useLifeline(t){
    const q = this.quiz;
    if(!q || q.locked) return;
    if(t === 'fifty' && q.lifelines.fifty){
      q.lifelines.fifty = false;
      const Q = q.questions[q.index];
      let wrong = [0,1,2,3].filter(function(i){ return i !== Q.answer; });
      wrong = shuffle(wrong).slice(0,2);
      wrong.forEach(function(i){
        const b = document.getElementById('opt-' + i);
        if(b){ b.disabled = true; b.classList.add('opt-dim'); }
      });
      soundManager.playClick();
      this.updateLifelineUI();
      this.toast('50:50 used!');
    }else if(t === 'freeze' && q.lifelines.freeze){
      q.lifelines.freeze = false;
      q.frozen = true;
      soundManager.playClick();
      this.updateLifelineUI();
      this.toast('❄️ Timer frozen for 5s!');
      setTimeout(function(){ if(q) q.frozen = false; }, 5000);
    }else if(t === 'double' && q.lifelines.double){
      q.lifelines.double = false;
      q.isDouble = true;
      soundManager.playClick();
      this.updateLifelineUI();
      this.toast('✨ 2x points on your next correct answer!');
    }
  },

  updateLifelineUI(){
    const q = this.quiz;
    if(!q) return;
    const f = document.getElementById('ll-fifty');
    const fr = document.getElementById('ll-freeze');
    const d = document.getElementById('ll-double');
    if(f){ f.disabled = !q.lifelines.fifty; f.classList.toggle('opacity-40', !q.lifelines.fifty); }
    if(fr){ fr.disabled = !q.lifelines.freeze; fr.classList.toggle('opacity-40', !q.lifelines.freeze); }
    if(d){
      d.disabled = (!q.lifelines.double || q.isDouble);
      d.classList.toggle('opacity-40', !q.lifelines.double && !q.isDouble);
      d.innerText = q.isDouble ? '✨ 2x ACTIVE' : '✨ 2x Points';
    }
  },

  selectAnswer(i, timeout){
    const q = this.quiz;
    if(!q || q.locked) return;
    q.locked = true;
    clearInterval(q.timerInterval);
    clearTimeout(this._nx);

    const Q = q.questions[q.index];
    const correctIdx = Q.answer;
    const isCorrect = (i === correctIdx);

    for(let k=0;k<4;k++){
      const b = document.getElementById('opt-' + k);
      if(b) b.disabled = true;
    }
    const cb = document.getElementById('opt-' + correctIdx);
    if(cb) cb.classList.add('opt-correct');

    if(!isCorrect && i >= 0){
      const wb = document.getElementById('opt-' + i);
      if(wb){ wb.classList.add('opt-wrong'); wb.classList.add('shake'); }
      const card = document.getElementById('q-card');
      if(card) card.classList.add('shake');
      soundManager.playWrong();
    }else if(isCorrect){
      soundManager.playCorrect();
    }else{
      soundManager.playWrong();
    }

    let gained = 0;
    if(isCorrect){
      gained = 100 + Math.max(0, q.timeLeft) * 10 + q.streak * 20;
      if(q.isDouble){ gained *= 2; q.isDouble = false; }
      q.score += gained;
      q.correct++;
      q.streak++;
      q.maxStreak = Math.max(q.maxStreak, q.streak);
      if(q.streak >= 3) soundManager.playFanfare();
    }else{
      q.streak = 0;
    }

    q.log.push({q:Q.question, pick:i, correct:correctIdx, ok:isCorrect});

    const hs = document.getElementById('hud-score');
    if(hs) hs.innerText = q.score + ' pts';
    const hk = document.getElementById('hud-streak');
    if(hk) hk.innerText = '🔥 x' + q.streak;

    const eb = document.getElementById('explain-box');
    const last = (q.index + 1) >= q.questions.length;
    if(eb){
      eb.classList.remove('hidden');
      eb.innerHTML = `
        <div class="flex items-start gap-3">
          <div class="w-10 h-10 rounded-xl ${isCorrect ? 'bg-emerald-500/20 text-emerald-300' : 'bg-rose-500/20 text-rose-300'} flex items-center justify-center text-lg shrink-0">${isCorrect ? '✅' : '❌'}</div>
          <div class="flex-1">
            <p class="font-bold text-sm ${isCorrect ? 'text-emerald-300' : 'text-rose-300'}">
              ${timeout ? '⏰ Time up!' : (isCorrect ? ('Correct! +' + gained + ' pts') : ('Wrong! Correct answer: ' + esc(Q.options[correctIdx])))}
            </p>
            <p class="text-xs text-slate-400 mt-1">💡 ${esc(Q.explanation || '')}</p>
            <button onclick="app.nextQuestion()" class="mt-3 px-5 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold">
              ${last ? 'Finish' : 'Next →'}
            </button>
          </div>
        </div>`;
    }

    if(q.mode === 'room') this.pushRoomProgress();
    else this.updateLeaderboard();

    const self = this;
    this._nx = setTimeout(function(){ self.nextQuestion(); }, 2800);
  },

  pushRoomProgress(){
    const r = RoomManager.get(this.roomCode);
    if(!r) return;
    const me = r.players.filter(function(p){ return p.id === app.clientId; })[0];
    if(!me) return;
    me.score = this.quiz.score;
    me.correct = this.quiz.correct;
    me.maxStreak = this.quiz.maxStreak;
    me.progress = this.quiz.index + 1;
    if(me.progress >= this.quiz.questions.length) me.finished = true;
    RoomManager.save(r);
    this.room = r;
    this.updateRoomLeaderboard();
  },

  nextQuestion(){
    clearTimeout(this._nx);
    const q = this.quiz;
    if(!q) return;
    q.index++;
    if(q.index >= q.questions.length) this.finishQuiz();
    else this.showQuestion();
  },

  finishQuiz(){
    const q = this.quiz;
    if(!q) return;
    clearInterval(q.timerInterval);
    clearTimeout(this._nx);

    if(q.mode === 'room'){
      const r = RoomManager.get(this.roomCode);
      if(r){
        const me = r.players.filter(function(p){ return p.id === app.clientId; })[0];
        if(me){
          me.score = q.score; me.correct = q.correct;
          me.maxStreak = q.maxStreak;
          me.progress = q.questions.length;
          me.finished = true;
        }
        if(r.players.every(function(p){ return p.finished; })) r.status = 'finished';
        RoomManager.save(r);
        this.room = r;
        if(r.status === 'finished') this.showRoomResults();
        else{ this.view = 'results'; this.showRoomWaiting(); }
      }else{
        this.showHome();
      }
      return;
    }

    /* ---- solo / bots results ---- */
    const total = q.questions.length;
    const topBot = q.opponents.length ? Math.max.apply(null, q.opponents.map(function(o){ return o.score; })) : 0;
    const won = q.mode === 'solo' ? (q.correct >= Math.ceil(total * 0.6)) : (q.score >= topBot);
    const earn = Math.floor(q.score / 10) + q.correct * 5 + (won ? 100 : 10);
    this.coins += earn;
    this.saveProfile();
    const nc = document.getElementById('nav-player-coins');
    if(nc) nc.innerText = this.coins.toLocaleString();

    if(won){
      soundManager.playFanfare();
      try{
        confetti({particleCount:160, spread:75, origin:{y:.6}});
        setTimeout(function(){ confetti({particleCount:80, angle:60, spread:60, origin:{x:0}}); }, 300);
        setTimeout(function(){ confetti({particleCount:80, angle:120, spread:60, origin:{x:1}}); }, 450);
      }catch(e){}
    }

    this.view = 'results';

    const rows = [{name:this.playerName, avatar:this.playerAvatar, score:q.score, correct:q.correct, me:true}]
      .concat(q.opponents.map(function(o){
        return {name:o.name, avatar:o.avatar, score:o.score, correct:o.correct || 0, me:false};
      }));
    rows.sort(function(a,b){ return b.score - a.score; });
    const rank = rows.findIndex(function(r){ return r.me; }) + 1;
    const self = this;

    const c = document.getElementById('app-container');
    c.innerHTML = `
      <div class="max-w-3xl mx-auto w-full space-y-5 fade-up text-center">
        <div class="bg-arena-card border border-arena-border rounded-3xl p-8">
          <div class="text-6xl mb-3">${rank === 1 ? '🏆' : '🎮'}</div>
          <h2 class="text-3xl font-display font-black">${rank === 1 ? 'Victory!' : 'Match Complete!'}</h2>
          <p class="text-slate-400 text-sm mt-1">You placed <b class="text-white">#${rank}</b> of ${rows.length} • +${earn} coins</p>
          <div class="grid grid-cols-3 gap-3 mt-5 max-w-md mx-auto">
            <div class="bg-arena-dark rounded-2xl p-3 border border-arena-border"><p class="text-2xl font-black text-emerald-300">${q.score}</p><p class="text-[11px] text-slate-500 font-bold">SCORE</p></div>
            <div class="bg-arena-dark rounded-2xl p-3 border border-arena-border"><p class="text-2xl font-black text-indigo-300">${q.correct}/${total}</p><p class="text-[11px] text-slate-500 font-bold">CORRECT</p></div>
            <div class="bg-arena-dark rounded-2xl p-3 border border-arena-border"><p class="text-2xl font-black text-orange-300">x${q.maxStreak}</p><p class="text-[11px] text-slate-500 font-bold">STREAK</p></div>
          </div>
        </div>

        <div class="bg-arena-card border border-arena-border rounded-2xl p-4 text-left">
          <p class="font-bold text-sm mb-3">🏁 Final Standings</p>
          <div class="space-y-2">
            ${rows.map(function(r,i){
              return `<div class="flex items-center gap-3 p-3 rounded-xl ${r.me ? 'bg-indigo-600/15 border border-indigo-500/40' : 'bg-arena-dark border border-arena-border'}">
                <span class="font-black ${i === 0 ? 'text-arena-gold text-lg' : 'text-slate-500'}">${i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : '#' + (i+1)}</span>
                <span class="text-2xl">${r.avatar}</span>
                <div class="flex-1"><p class="font-bold text-sm">${esc(r.name)} ${r.me ? '(You)' : ''}</p><p class="text-[11px] text-slate-500">${r.correct} correct</p></div>
                <span class="font-black text-emerald-300">${r.score}</span>
              </div>`;
            }).join('')}
          </div>
        </div>

        <div class="bg-arena-card border border-arena-border rounded-2xl p-4 text-left">
          <p class="font-bold text-sm mb-3">📝 Answer Review</p>
          <div class="space-y-2 max-h-56 overflow-y-auto">
            ${q.log.map(function(l,i){
              const qq = q.questions[i];
              return `<div class="text-xs p-2.5 rounded-xl ${l.ok ? 'bg-emerald-950/40 border border-emerald-500/20' : 'bg-rose-950/40 border border-rose-500/20'}">
                <p class="font-bold">${i+1}. ${esc(l.q)}</p>
                <p class="text-slate-400 mt-1">${l.ok ? '✅' : '❌'} You: ${l.pick >= 0 ? esc(qq.options[l.pick]) : 'Timeout'} • Correct: ${esc(qq.options[l.correct])}</p>
              </div>`;
            }).join('')}
          </div>
        </div>

        <div class="flex flex-col sm:flex-row gap-3">
          <button onclick="app.startGame('${q.category}')" class="flex-1 py-3 rounded-xl bg-gradient-to-r from-indigo-600 to-purple-600 font-bold">🔁 Play Again</button>
          <button onclick="app.showHome()" class="flex-1 py-3 rounded-xl bg-arena-card border border-arena-border font-bold">🏠 Home</button>
          <button onclick="app.createRoom()" class="flex-1 py-3 rounded-xl bg-fuchsia-600/20 border border-fuchsia-500/40 text-fuchsia-200 font-bold"><i class="fa-solid fa-qrcode mr-1"></i> QR Room</button>
        </div>
      </div>`;
    window.scrollTo(0,0);
  },

  showRoomWaiting(){
    const q = this.quiz;
    const c = document.getElementById('app-container');
    c.innerHTML = `
      <div class="max-w-lg mx-auto text-center space-y-5 fade-up">
        <div class="bg-arena-card border border-emerald-500/30 rounded-3xl p-8">
          <div class="text-5xl animate-bounce">⏳</div>
          <h2 class="text-2xl font-display font-black mt-3">You Finished!</h2>
          <p class="text-sm text-slate-400">Score <b class="text-emerald-300">${q.score}</b> • ${q.correct}/${q.questions.length} correct • Waiting for other scanners…</p>
          <div class="mt-4 bg-arena-dark rounded-2xl p-3 border border-arena-border">
            <div id="live-leaderboard" class="space-y-2 text-left"></div>
          </div>
        </div>
        <button onclick="app.showRoomResults(true)" class="px-5 py-2.5 rounded-xl bg-arena-dark border border-arena-border text-xs font-bold">View Live Standings</button>
      </div>`;
    this.updateRoomLeaderboard();
  },

  showRoomResults(preview){
    if(this.quiz) clearInterval(this.quiz.timerInterval);
    clearInterval(this.botSimInt);
    this.view = 'results';
    this._resultShown = true;

    const r = RoomManager.get(this.roomCode) || this.room;
    if(!r){ this.showHome(); return; }

    const sorted = r.players.slice().sort(function(a,b){ return (b.score||0) - (a.score||0); });
    const me = sorted.filter(function(p){ return p.id === app.clientId; })[0];
    const rank = sorted.findIndex(function(p){ return p.id === app.clientId; }) + 1;
    const isHost = r.hostId === this.clientId;

    if(!preview && r.status === 'finished' && rank === 1 && me && !this._rewardedRoom){
      this._rewardedRoom = r.code;
      this.coins += 150;
      this.saveProfile();
      const nc = document.getElementById('nav-player-coins');
      if(nc) nc.innerText = this.coins.toLocaleString();
      soundManager.playFanfare();
      try{ confetti({particleCount:180, spread:80}); }catch(e){}
    }
    if(r.status !== 'finished') this._rewardedRoom = null;

    const c = document.getElementById('app-container');
    c.innerHTML = `
      <div class="max-w-3xl mx-auto w-full space-y-5 fade-up text-center">
        <div class="bg-arena-card border ${r.status === 'finished' ? 'border-amber-500/40' : 'border-arena-border'} rounded-3xl p-8">
          <div class="text-6xl">${rank === 1 ? '🏆' : rank === 2 ? '🥈' : rank === 3 ? '🥉' : '🎮'}</div>
          <h2 class="text-3xl font-display font-black mt-2">${r.status === 'finished' ? 'Room Results' : 'Live Standings'}</h2>
          <p class="text-sm text-slate-400">Room <b class="text-white tracking-widest">${r.code}</b> • You ranked <b class="text-white">#${rank}</b> of ${sorted.length}</p>
          ${me ? `
            <div class="grid grid-cols-3 gap-3 mt-5 max-w-md mx-auto">
              <div class="bg-arena-dark rounded-2xl p-3 border border-arena-border"><p class="text-2xl font-black text-emerald-300">${me.score || 0}</p><p class="text-[11px] text-slate-500 font-bold">SCORE</p></div>
              <div class="bg-arena-dark rounded-2xl p-3 border border-arena-border"><p class="text-2xl font-black text-indigo-300">${me.correct || 0}</p><p class="text-[11px] text-slate-500 font-bold">CORRECT</p></div>
              <div class="bg-arena-dark rounded-2xl p-3 border border-arena-border"><p class="text-2xl font-black text-orange-300">x${me.maxStreak || 0}</p><p class="text-[11px] text-slate-500 font-bold">STREAK</p></div>
            </div>` : ''}
        </div>

        <div class="bg-arena-card border border-arena-border rounded-2xl p-4 text-left">
          <p class="font-bold text-sm mb-3">🏁 ${r.status === 'finished' ? 'Final Leaderboard' : 'Updating live…'}</p>
          <div class="space-y-2">
            ${sorted.map(function(p,i){
              return `<div class="flex items-center gap-3 p-3 rounded-xl ${p.id === app.clientId ? 'bg-indigo-600/15 border border-indigo-500/40' : 'bg-arena-dark border border-arena-border'}">
                <span class="font-black w-8 text-center ${i === 0 ? 'text-arena-gold text-lg' : 'text-slate-500'}">${i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : '#' + (i+1)}</span>
                <span class="text-2xl">${p.avatar || '🙂'}</span>
                <div class="flex-1 min-w-0">
                  <p class="font-bold text-sm truncate">${esc(p.name)} ${p.id === app.clientId ? '(You)' : ''} ${p.isBot ? '🤖' : ''}</p>
                  <p class="text-[11px] text-slate-500">${p.correct || 0} correct • ${p.finished ? '✅ done' : '⏳ playing'} • via ${(p.joinedVia || 'qr').toUpperCase()}</p>
                </div>
                <span class="font-black text-emerald-300">${p.score || 0}</span>
              </div>`;
            }).join('')}
          </div>
        </div>

        <div class="flex flex-col sm:flex-row gap-3">
          ${(isHost && r.status === 'finished') ? '<button onclick="app.rematchRoom()" class="flex-1 py-3 rounded-xl bg-gradient-to-r from-emerald-600 to-teal-600 font-bold">🔁 Back to Lobby (Rematch)</button>' : ''}
          ${r.status !== 'finished' ? '<button onclick="app.showRoomResults(true)" class="flex-1 py-3 rounded-xl bg-arena-card border border-arena-border font-bold">🔄 Refresh</button>' : ''}
          <button onclick="app.showLobby()" class="flex-1 py-3 rounded-xl bg-arena-card border border-arena-border font-bold">📷 Room &amp; QR</button>
          <button onclick="app.leaveRoom()" class="flex-1 py-3 rounded-xl bg-fuchsia-600/20 border border-fuchsia-500/40 font-bold">🏠 Leave</button>
        </div>
        ${r.status !== 'finished' ? '<p class="text-[11px] text-slate-500">Waiting for all members to finish — results finalize automatically.</p>' : ''}
      </div>`;
    window.scrollTo(0,0);
  },

  /* ============================================================
     QUESTION BANK EXPLORER
     ============================================================ */
  openBank(){
    soundManager.playClick();
    const m = document.getElementById('bank-modal');
    m.classList.remove('hidden'); m.classList.add('flex');
    this.renderBankChips();
    this.renderBankList();
  },
  closeBank(){
    const m = document.getElementById('bank-modal');
    m.classList.add('hidden'); m.classList.remove('flex');
    soundManager.playClick();
  },
  renderBankChips(){
    const el = document.getElementById('bank-chips');
    if(!el) return;
    const self = this;
    el.innerHTML = CATEGORIES.filter(function(c){ return c.id !== 'mixed'; }).map(function(c){
      return '<button onclick="app.bankFilter=\'' + c.id + '\';app.renderBankChips();app.renderBankList()" class="shrink-0 px-3 py-1.5 rounded-lg text-[11px] font-bold border ' +
        (self.bankFilter === c.id ? 'bg-indigo-600 text-white border-indigo-500' : 'bg-arena-dark text-slate-400 border-arena-border') +
        '">' + c.name + '</button>';
    }).join('');
  },
  renderBankList(){
    const el = document.getElementById('bank-list');
    if(!el) return;
    const list = QUESTION_BANK[this.bankFilter] || [];
    if(!list.length){
      el.innerHTML = '<p class="text-slate-400 text-sm text-center py-8">No questions in this arena yet.</p>';
      return;
    }
    el.innerHTML = list.map(function(q,i){
      return `<div class="bg-arena-dark border border-arena-border rounded-xl p-4">
        <div class="flex items-start gap-3">
          <span class="w-7 h-7 rounded-lg bg-indigo-600/20 border border-indigo-500/40 text-indigo-300 text-xs font-black flex items-center justify-center shrink-0">${i+1}</span>
          <div class="flex-1 min-w-0">
            <span class="text-[10px] font-black uppercase tracking-widest text-indigo-400">${esc(q.sub || q.category)}</span>
            <p class="font-semibold text-sm mt-1">${esc(q.question)}</p>
            <div class="grid grid-cols-2 gap-1.5 mt-2">
              ${q.options.map(function(o,oi){
                return `<div class="text-[11px] px-2 py-1.5 rounded-lg border ${oi === q.answer ? 'bg-emerald-600/20 border-emerald-500/40 text-emerald-200' : 'bg-arena-card border-arena-border text-slate-400'}">
                  <b>${['A','B','C','D'][oi]}.</b> ${esc(o)}
                </div>`;
              }).join('')}
            </div>
            <p class="text-[11px] text-slate-500 mt-2">💡 ${esc(q.explanation || '')}</p>
          </div>
        </div>
      </div>`;
    }).join('');
  }
};

document.addEventListener('DOMContentLoaded', function(){ app.init(); });
</script>
</body>
</html>
